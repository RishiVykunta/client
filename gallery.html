<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Gallery - Raise with Simran</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Work+Sans:wght@300;400;500;600&display=swap');
  
  :root{
    --ink:#221C1A;
    --plum:#4A3F3A;
    --plum-deep:#2E2724;
    --marigold:#C89759;
    --blush:#EFE8DE;
    --cream:#F9F6F0;
    --line:rgba(34,28,26,0.12);
    --max:1180px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--cream);color:var(--ink);
    font-family:'Work Sans', sans-serif;
  }
  a{text-decoration:none; color:inherit;}
  img{max-width:100%; display:block;}
  
  header{
    position:relative;z-index:50;
    background:#FBF6F0;
    border: 3px solid var(--marigold);
    box-shadow: 0 10px 30px rgba(200, 151, 89, 0.25);
    border-radius: 40px;
    max-width: 90%;
    margin: 15px auto;
  }
  nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 24px;max-width:var(--max);margin:0 auto;
  }
  .logo{font-family:'Fraunces', serif;font-size:22px;font-weight:600;}
  .logo span{color:var(--marigold);font-style:italic;}
  .btn{
    padding:11px 22px;border-radius:100px;font-size:14px;
    background:var(--plum-deep);color:var(--cream);
    transition: background 0.3s;
  }
  .btn:hover {
    background: var(--marigold);
    color: var(--plum-deep);
  }
  
  .gallery-page-header {
    text-align: center;
    padding: 60px 20px 40px;
  }
  .gallery-page-header h1 {
    font-family: 'Fraunces', serif;
    font-size: 48px;
    color: var(--plum-deep);
    margin-bottom: 10px;
  }
  
  .full-gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    padding: 0 24px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .full-gallery-grid img {
    width: 100%;
    height: 350px;
    object-fit: cover;
    border-radius: 12px;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .full-gallery-grid img:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }
  
  @media (max-width: 768px) {
    .full-gallery-grid {
      grid-template-columns: 1fr;
    }
    .full-gallery-grid img {
      height: 300px;
    }
  }
</style>
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">
        <img src="https://res.cloudinary.com/ugws99t1/image/upload/v1785422131/logo_lujmvp.jpg" alt="Raise with Simran" style="max-height: 45px; width: auto; mix-blend-mode: multiply;">
      </a>
      <a href="index.html" class="btn">Back to Home</a>
    </nav>
  </header>

  <div class="gallery-page-header">
    <h1>Our Gallery</h1>
    <p>Moments from our circles, workshops, and events.</p>
  </div>

  <div class="full-gallery-grid">
    <img src="https://res.cloudinary.com/ugws99t1/image/upload/v1785423086/d3409e1a-5c1b-4d12-a207-88151ee8f755_pk8lnd.jpg" alt="Gallery Image 1">
    <img src="https://res.cloudinary.com/ugws99t1/image/upload/v1785423071/549d852c-3677-4e61-b27e-56fbc801115d_zwdjhb.jpg" alt="Gallery Image 2">
    <img src="https://res.cloudinary.com/ugws99t1/image/upload/v1785423060/469f1b47-e8d9-4e82-a714-66dbb474f377_l7c9va.jpg" alt="Gallery Image 3">
    <img src="https://res.cloudinary.com/ugws99t1/image/upload/v1785423050/1dc99054-3ec4-426f-a7aa-d5fbdf95e28f_dzuafb.jpg" alt="Gallery Image 4">
    <img src="https://res.cloudinary.com/ugws99t1/image/upload/v1785423041/f9ead026-b10c-4a3e-b555-a2f2e44ac38f_ytdgxd.jpg" alt="Gallery Image 5">
    <img src="https://res.cloudinary.com/ugws99t1/image/upload/v1785423025/11da99c7-c1e4-4bd7-8c6b-580e752aaef1_dbognq.jpg" alt="Gallery Image 6">
    <img src="https://res.cloudinary.com/dqcxekzxn/image/upload/v1783654862/download_2_fdysec.jpg" alt="Gallery Image 7">
    <img src="https://res.cloudinary.com/ugws99t1/image/upload/v1785425471/e03c69b4-5b68-4a11-ba4f-7133e5a0638a_so2exy.jpg" alt="Gallery Image 8">
  </div>
  <div style="text-align:center; padding-bottom:60px;">
    <a href="https://www.instagram.com/bloomwith.simran?igsh=bHB0aTI4Zmtjd3Y4" target="_blank" class="btn" style="background:var(--marigold);color:var(--plum-deep);border:none;">View more on Instagram</a>
  </div>
</body>
</html>
